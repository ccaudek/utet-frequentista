project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Inferenza frequentista in psicologia"
  subtitle: "Modulo introduttivo"
  description: "Modulo introduttivo sull'inferenza frequentista in psicologia, parte del progetto UTET a supporto del manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*."
  license: "CC BY-NC-ND 4.0"

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"

  site-url: https://ccaudek.github.io/utet-frequentista/
  repo-url: https://github.com/ccaudek/utet-frequentista/
  repo-actions: [source, issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Inferenza frequentista in psicologia** — Modulo del progetto UTET a supporto del manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd
    # - prefazione.qmd

    - part: "Frequentismo"
      chapters:
        - chapters/frequentist_inference/introduction_frequentist_inference.qmd
        - chapters/frequentist_inference/01_galton.qmd
        - chapters/frequentist_inference/02_stime_parametri.qmd
        - chapters/frequentist_inference/03_conf_interv.qmd
        - chapters/frequentist_inference/04_test_ipotesi.qmd
        - chapters/frequentist_inference/05_sample_size.qmd
        - chapters/frequentist_inference/06_two_ind_samples.qmd

    - part: "Epilogo"
      chapters:
        - chapters/epilogo/epilogo.qmd

toc: true
toc-depth: 2

bibliography: references.bib
csl: apa.csl
link-citations: true
link-bibliography: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-prob/"

    html-math-method:
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


# ============================================================
# Sezione `format: pdf:` per _quarto.yml — utet-frequentista
# Sostituisce integralmente la sezione pdf esistente.
# Stile: manuale universitario di statistica (KOMA scrbook).
# ============================================================

  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 11pt
      - open=any        # per una resa da libro stampato: open=right
      - headings=big
      - numbers=noenddot

    pdf-engine: lualatex
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "Libertinus Mono"
    mathfont: "Libertinus Math"   # matematica coerente col testo;
                                  # se il font non è installato, rimuovere questa riga
    lang: it

    toc: true
    toc-depth: 2
    number-sections: true

    # Bibliografia distinta alla fine di ciascun capitolo.
    # Installare una sola volta dalla radice del progetto:
    # quarto add pandoc-ext/section-bibliographies --no-prompt
    filters:
      - quarto
      - pandoc-ext/section-bibliographies
    citeproc: false
    reference-section-title: "Riferimenti bibliografici"
    section-bibliographies:
      level: 1
      minlevel: 1
      cleanup-first: true

    colorlinks: true
    linkcolor: MidnightBlue
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    highlight-style: github
    code-overflow: wrap
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top

    geometry:
      - top=25mm
      - bottom=26mm
      - inner=31mm
      - outer=24mm
      - headsep=8mm
      - footskip=12mm
      - heightrounded

    include-in-header:
      text: |
        % ==========================================================
        % 1. Microtipografia e impostazione del paragrafo
        % ==========================================================
        \usepackage{microtype}
        \microtypesetup{protrusion=true,expansion=true,tracking=true}
        \emergencystretch=2em
        \setlength{\parindent}{1.25em}
        \setlength{\parskip}{0pt plus 0.5pt}
        \AtBeginDocument{\linespread{1.05}\selectfont}

        % ==========================================================
        % 2. Palette editoriale
        % ==========================================================
        \definecolor{BookAccent}{HTML}{243B53}       % blu editoriale sobrio
        \definecolor{BookAccentLight}{HTML}{C9D4E0}  % numeri di capitolo, filetti chiari
        \definecolor{BookGrey}{HTML}{5A6572}         % elementi secondari

        % ==========================================================
        % 3. Testatine e piè di pagina
        % ==========================================================
        \usepackage[automark,headsepline=0.4pt]{scrlayer-scrpage}
        \clearpairofpagestyles
        \automark[section]{chapter}
        \ihead[]{\headmark}
        \ohead[]{\pagemark}
        \cfoot[\pagemark]{}
        \setkomafont{pageheadfoot}{\small\sffamily\color{BookGrey}}
        \setkomafont{pagenumber}{\small\sffamily\bfseries\color{BookAccent}}
        \addtokomafont{headsepline}{\color{BookAccentLight}}

        % ==========================================================
        % 4. Aperture di capitolo
        %    Numero grande in tinta chiara allineato a destra,
        %    filetto pieno, titolo ampio: impianto da manuale.
        % ==========================================================
        \RedeclareSectionCommand[
          beforeskip=1\baselineskip,
          afterskip=2\baselineskip,
          tocbeforeskip=1.1\baselineskip
        ]{chapter}
        \setkomafont{disposition}{\normalfont\sffamily\bfseries}
        \setkomafont{chapter}{\normalfont\sffamily\bfseries\Huge\color{BookAccent}}
        \renewcommand*{\chapterformat}{%
          {\normalfont\sffamily\bfseries\fontsize{58}{58}\selectfont
           \color{BookAccentLight}\thechapter}}
        \renewcommand{\chapterlinesformat}[3]{%
          \Ifstr{#2}{}{%
            % Capitoli non numerati (Prefazione, Conclusioni, ...)
            {\raggedright #3\par}\nobreak
            \vskip 0.5\baselineskip
            {\color{BookAccent}\rule{\textwidth}{0.9pt}}\par
          }{%
            % Capitoli numerati
            {\raggedleft #2\par}\nobreak
            \vskip 0.4\baselineskip
            {\color{BookAccent}\rule{\textwidth}{0.9pt}}\par\nobreak
            \vskip 1\baselineskip
            {\raggedright #3\par}}}

        % ==========================================================
        % 5. Gerarchia dei titoli interni
        % ==========================================================
        \setkomafont{section}{\normalfont\sffamily\bfseries\Large\color{BookAccent}}
        \setkomafont{subsection}{\normalfont\sffamily\bfseries\large}
        \setkomafont{subsubsection}{\normalfont\sffamily\bfseries\normalsize\color{BookGrey}}
        \RedeclareSectionCommands[
          beforeskip=1.6\baselineskip,
          afterskip=0.8\baselineskip
        ]{section}
        \RedeclareSectionCommands[
          beforeskip=1.3\baselineskip,
          afterskip=0.6\baselineskip
        ]{subsection,subsubsection}

        % ==========================================================
        % 6. Frontespizi di parte
        % ==========================================================
        \setkomafont{part}{\normalfont\sffamily\bfseries\Huge\color{BookAccent}}
        \setkomafont{partnumber}{\normalfont\sffamily\mdseries\huge\color{BookGrey}}

        % ==========================================================
        % 7. Sommario
        % ==========================================================
        \setkomafont{partentry}{\sffamily\bfseries\large\color{BookAccent}}
        \setkomafont{chapterentry}{\sffamily\bfseries}
        \setkomafont{chapterentrypagenumber}{\sffamily\bfseries}

        % ==========================================================
        % 8. Didascalie e tabelle
        % ==========================================================
        \setkomafont{caption}{\small}
        \setkomafont{captionlabel}{\small\sffamily\bfseries\color{BookAccent}}
        \setcapindent{0pt}
        \usepackage{booktabs}
        \usepackage{array}

        % ==========================================================
        % 9. Note a piè di pagina e descrizioni
        % ==========================================================
        \setkomafont{footnote}{\small}
        \deffootnote{1.4em}{1em}{\textsuperscript{\thefootnotemark}\,}
        \setkomafont{descriptionlabel}{\sffamily\bfseries}

        % ==========================================================
        % 10. Spaziatura attorno a figure e tabelle
        % ==========================================================
        \setlength{\textfloatsep}{18pt plus 3pt minus 3pt}
        \setlength{\floatsep}{14pt plus 3pt minus 2pt}
        \setlength{\intextsep}{14pt plus 3pt minus 2pt}

        % ==========================================================
        % 11. Elenchi
        % ==========================================================
        \usepackage{enumitem}
        \setlist{itemsep=0.25em,topsep=0.5em,parsep=0pt,partopsep=0pt}

        % ==========================================================
        % 12. Controllo di vedove, orfane e salti di pagina
        % ==========================================================
        \clubpenalty=10000
        \widowpenalty=10000
        \displaywidowpenalty=10000
        \brokenpenalty=10000


execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90
