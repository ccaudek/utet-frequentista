project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Inferenza frequentista in psicologia"
  subtitle: "Modulo introduttivo"
  description: "Modulo introduttivo sull'inferenza frequentista in psicologia, parte del progetto UTET a supporto del manuale Metodi bayesiani in psicologia."
  license: "CC BY-NC-ND 4.0"
  favicon: style/gauss.png

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"

  site-url: https://ccaudek.github.io/utet-frequentista/
  repo-url: https://github.com/ccaudek/utet-frequentista/
  repo-actions: [source, issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Inferenza frequentista in psicologia** — Modulo del progetto UTET a supporto del manuale *Metodi bayesiani in psicologia*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd
    # - prefazione.qmd

    - part: "Frequentismo"
      chapters:
        - chapters/frequentist_inference/introduction_frequentist_inference.qmd
        - chapters/frequentist_inference/01_galton.qmd
        - chapters/frequentist_inference/02_stime_parametri.qmd
        - chapters/frequentist_inference/03_conf_interv.qmd
        - chapters/frequentist_inference/04_test_ipotesi.qmd
        - chapters/frequentist_inference/05_sample_size.qmd
        - chapters/frequentist_inference/06_two_ind_samples.qmd

    - part: "Epilogo"
      chapters:
        - chapters/epilogo/epilogo.qmd

crossref:
  appendix-title: "Appendice"

toc: true
toc-depth: 2

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-prob/"

    html-math-method: 
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 11pt
      - open=any            # i capitoli non iniziano forzatamente a pagina dispari
                            # (evita pagine bianche: sensato per un PDF letto a schermo;
                            # per la stampa tipografica rimuovere questa riga)
    pdf-engine: lualatex    
    mainfont: "Libertinus Serif"   # copertura IAST completa; alternative: "Gentium Plus",
    sansfont: "Libertinus Sans"    # "EB Garamond", "Charis SIL"
    lang: it                # se non è già a livello di progetto: attiva sillabazione
                            # italiana e traduce "Indice", "Capitolo", ecc.
    toc: true
    toc-depth: 2
    number-sections: true

    colorlinks: true
    linkcolor: MidnightBlue    # più sobrio del blu acceso predefinito
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    geometry:
      - top=25mm
      - bottom=25mm
      - inner=30mm           # con scrbook (twoside) inner/outer è più corretto
      - outer=25mm           # di left/right: il margine interno assorbe la rilegatura

    include-in-header:
      text: |
        \usepackage[automark]{scrlayer-scrpage}  % testatine correnti (capitolo/sezione)
        \clubpenalty=10000                        % niente righe orfane
        \widowpenalty=10000                       % niente righe vedove


execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90

