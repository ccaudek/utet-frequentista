project:
  type: book
  output-dir: docs

book:
  title: "Inferenza frequentista in psicologia"
  subtitle: "Modulo introduttivo"
  license: "Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0)"
  reader-mode: true
  google-analytics: G-QT5S3P9D31

  author: 
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"
  date: "last-modified"
  search: true
  repo-url: https://github.com/ccaudek/utet-frequentista/
  repo-actions: [source, issue]
  back-to-top-navigation: true
  site-url: https://ccaudek.github.io/utet-frequentista/
  page-footer:
    left: |
      **Inferenza frequentista in psicologia** — Modulo del progetto UTET a supporto del manuale *Metodi bayesiani in psicologia*.
    right: |
      Realizzato con <a href="https://quarto.org/">Quarto</a>.
  favicon: style/gauss.png

  sidebar:
    # style: "docked"
    search: true
    collapse-level: 1

  chapters:
    - index.qmd
    # - prefazione.qmd

    - part: "Frequentismo"
      chapters:
        - chapters/frequentist_inference/introduction_frequentist_inference.qmd
        - chapters/frequentist_inference/01_galton.qmd
        - chapters/frequentist_inference/02_stime_parametri.qmd
        - chapters/frequentist_inference/03_conf_interv.qmd
        # - chapters/frequentist_inference/04_sample_size.qmd
        - chapters/frequentist_inference/05_test_ipotesi.qmd
        - chapters/frequentist_inference/06_two_ind_samples.qmd

    - part: "Epilogo"
      chapters:
        - chapters/epiloque/epiloque.qmd

crossref:
  appendix-title: "Appendice"

toc: true
toc-depth: 2

bibliography: ./references.bib
biblio-style: apalike
csl: apa.csl
link-citations: true

format:
  html:
    # -------- Codice --------
    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true
    
    # -------- Tema --------
    theme:
      light: cosmo
      dark: darkly
    css: style/custom.css
    mainfont: "system-ui"
    lang: it
    
    # -------- Navigazione --------
    reader-mode: true
    toc: true              # TOC va qui sotto format:html:
    toc-depth: 2           # E anche toc-depth
    toc-title: "Sommario"
    smooth-scroll: true
    
    # -------- Link e note --------
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true
    
    # -------- Media --------
    lightbox: auto
    
    # -------- Matematica --------
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      # Macro opzionali (decommentare se serve)
      # macros:
      #   "\\E": "\\mathbb{E}"
      #   "\\Var": "\\mathrm{Var}"
      #   "\\Cov": "\\mathrm{Cov}"

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  fig.width: 6
  fig.asp: 0.618
  fig.retina: 2
  fig.align: "center"
  fig.show: "hold"
  options:
    width: 120
    pillar.width: Inf
    tibble.width: Inf

website:
  cookie-consent:
    type: express
    style: headline
    anonymize-ip: true
